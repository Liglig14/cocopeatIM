<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Cocopeat Potting Machine User Manual</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .viewer {
            width: 100vw;
            height: 100vh;

            display: flex;
            overflow-x: auto;
            overflow-y: hidden;

            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;

            scrollbar-width: none;
        }

        .viewer::-webkit-scrollbar {
            display: none;
        }

        .page {
            width: 100vw;
            height: 100vh;

            flex: 0 0 100vw;

            display: flex;
            justify-content: center;
            align-items: center;

            scroll-snap-align: center;
        }

        .page img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>

<body>

    <div class="viewer">

        <div class="page">
            <img src="images/1.png">
        </div>

        <div class="page">
            <img src="images/2.png">
        </div>

        <div class="page">
            <img src="images/3.png">
        </div>

        <div class="page">
            <img src="images/4.png">
        </div>

        <div class="page">
            <img src="images/5.png">
        </div>

    </div>

</body>
</html>
